<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In | STACKLY Performance & Wellness</title>
  <meta name="description" content="Sign in to your STACKLY dashboard to track workouts, manage clients, or review performance.">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth-dashboard.css">
</head>
<body class="auth-body">

  <div class="auth-card">
    <!-- Back to Home -->
    <a href="index.html" class="back-to-home-btn" id="login-back-home">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="19" y1="12" x2="5" y2="12"></line>
        <polyline points="12 19 5 12 12 5"></polyline>
      </svg>
      Back to Home
    </a>

    <!-- Header / Brand -->
    <div class="auth-header">
      <div class="auth-logo">
        <svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="text-primary">
          <path d="M12 2L2 7l10 5 10-5-10-5z"></path>
          <path d="M2 17l10 5 10-5"></path>
          <path d="M2 12l10 5 10-5"></path>
        </svg>
        <span>STACKLY.</span>
      </div>
      <h2>Welcome Back</h2>
      <p>Enter your details to access your portal</p>
    </div>

    <!-- Login Form -->
    <form class="auth-form" id="login-form" novalidate>
      
      <!-- Role Selector -->
      <div class="form-group">
        <label class="calc-label" for="login-role">Select Role</label>
        <select class="form-select" id="login-role" name="role" required>
          <option value="member">Member Portal</option>
          <option value="trainer">Trainer Portal</option>
          <option value="admin">Administrator Portal</option>
        </select>
      </div>

      <!-- Email Address -->
      <div class="form-group">
        <label class="calc-label" for="login-email">Email Address</label>
        <input type="email" class="form-input" id="login-email" name="email" placeholder="name@domain.com" required autocomplete="username">
      </div>

      <!-- Password -->
      <div class="form-group">
        <label class="calc-label" for="login-password">Password</label>
        <div class="password-wrapper">
          <input type="password" class="form-input" id="login-password" name="password" placeholder="••••••••" required autocomplete="current-password">
          <button type="button" class="password-toggle" data-target="login-password" aria-label="Toggle password visibility">
            <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </button>
        </div>
      </div>

      <!-- Submit CTA -->
      <button type="submit" class="btn btn-primary" id="login-submit" style="width: 100%; margin-top: 10px;">
        Sign In
        <svg viewBox="0 0 24 24" width="24" height="24">
          <path d="M5 12h14M12 5l7 7-7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>

    </form>

    <!-- Navigation to Sign Up -->
    <div class="auth-footer-links">
      Don't have an account? <a href="signup.html" id="link-create-account">Create Account</a>
    </div>

  </div>

  <script src="js/auth.js"></script>
</body>
</html>
